# SIVIA Global Pipeline Parameters
seed: 42

compute:
  profile: auto
  config_path: configs/compute/auto.yaml

kit:
  config_path: configs/kits/desk_kit_v1.yaml

capture:
  sample_fps: 2.0
  blur_threshold: 40.0
  min_brightness: 40.0
  max_brightness: 220.0
  dedup_cosine_threshold: 0.95

labeling:
  dataset_version: v1
  owlv2_threshold: 0.25
  gdino_threshold: 0.30
  wbf_iou_threshold: 0.55

training:
  model_family: yolo11
  model_variant: yolo11n
  epochs: 100
  imgsz: 416
  batch_size: 4
  learning_rate: 0.001

eval:
  iou_threshold: 0.5
  conf_threshold: 0.35

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "sivia_core"
