name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CPU PyTorch
        run: |
          uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,core]"

      - name: Run Ruff Linter & Formatter
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Run Hardware Probe
        run: |
          python3 scripts/probe_hardware.py --output configs/compute/auto.yaml

      - name: Run Unit Tests
        run: |
          pytest -v tests/
